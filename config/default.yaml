run:
  iterations: 4
  initial_prompt_samples: 3
  improved_prompt_samples: 3
  videos_per_prompt: 1
  early_stop_patience: 2
  duration_seconds: 5
  video_type: real-world
  random_seed: 42
  mode: train

mllm:
  provider: ark
  model: doubao-seed-2-0-mini-260215
  base_url: https://ark.cn-beijing.volces.com/api/v3
  api_key_env: ARK_API_KEY
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 2
  dry_run_when_api_key_missing: true
  video_input:
    mode: frames
    max_frames: 4
    jpeg_quality: 85

t2v:
  backend: wan_cli
  dry_run: true
  wan_dir: ../Wan2.1
  python_executable: python
  ckpt_dir: ../Wan2.1/pretrained
  task: t2v-1.3B
  size: "832*480"
  offload_model: true
  t5_cpu: false
  t5_fsdp: false
  dit_fsdp: false
  ulysses_size: 1
  ring_size: 1
  sample_solver: unipc
  sample_steps:
  sample_shift: 8
  sample_guide_scale: 6
  frame_num: 81
  cuda_visible_devices: "0"
  command_timeout_seconds: 0

selection:
  lambda_penalty: 0.1
  double_check_swapped_order: true
  random_on_disagreement: true
  strict_action_constraints:
    enabled: false

outputs:
  root_dir: outputs

skill_learning:
  enabled: false
  skill_dir: skills/rewrite-t2v-prompt
  rules_file: skills/rewrite-t2v-prompt/rules.json
  # Ablation controls. ``normal`` is the Full-skill behavior.
  activation_mode: normal
  # Required for activation_mode=random; counts global rules too.
  random_activation_count: null
  random_activation_seed: 42
  # Keep each module's initial negative_terms fixed during distillation.
  freeze_negative_prompt: false
