mllm:
  provider: vllm
  model: ${QWEN_MODEL_DIR:-/path/to/Qwen3.6-27B}
  model_path: ${QWEN_MODEL_DIR:-/path/to/Qwen3.6-27B}
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  api_key_required: false
  dry_run_when_api_key_missing: false
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 300
  max_retries: 2
  video_input:
    mode: frames
    max_frames: 4
    jpeg_quality: 85
